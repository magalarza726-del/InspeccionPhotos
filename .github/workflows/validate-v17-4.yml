name: Validate v17.4

on:
  push:
    branches: [ upload-v17-4 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct current source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          ok=0
          if compgen -G 'chunks/chunk-*' > /dev/null; then
            cat chunks/chunk-* | base64 --decode > /tmp/source.tar.xz || true
            if xz -t /tmp/source.tar.xz 2>/dev/null; then
              tar -xJf /tmp/source.tar.xz -C project
              ok=1
              echo 'Using chunks/'
            fi
          fi
          if [ "$ok" -eq 0 ] && compgen -G 'source_parts/part-*' > /dev/null; then
            cat source_parts/part-* | base64 --decode > /tmp/source.tar.xz || true
            if xz -t /tmp/source.tar.xz 2>/dev/null; then
              tar -xJf /tmp/source.tar.xz -C project
              ok=1
              echo 'Using source_parts/'
            fi
          fi
          if [ "$ok" -eq 0 ]; then
            echo 'No complete source archive found in repository.'
            exit 2
          fi
          echo 'Extracted top level:'
          find project -maxdepth 2 -type f | sort | head -80

      - name: Normalize extracted project root
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f project/gradlew ]; then
            inner="$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "$inner" ] && [ -f "$inner/gradlew" ]; then
              shopt -s dotglob nullglob
              mv "$inner"/* project/
              rmdir "$inner"
            fi
          fi
          test -f project/gradlew
          test -f project/app/build.gradle.kts

      - name: Apply v17.4 patch
        shell: bash
        run: |
          set -euo pipefail
          cat patch/chunk-* | base64 --decode | gzip -d > /tmp/v17.4.patch
          cd project
          patch -p1 --forward --batch < /tmp/v17.4.patch
          grep -q 'versionCode = 334' app/build.gradle.kts
          grep -q 'versionName = "3.3.4-section-placement"' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: project
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InspeccionPhotos-v17.4-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
